when:
  - event: tag

# Builds the encapi-cli RPM and publishes it to the ArtifactAPI rpm-internal
# repo. The server image is built separately by docker.yaml.
steps:
  - name: build
    image: artifactapi.example.com/docker-internal/gobuilder:0.1.2-alma9
    commands:
      - make build-cli VERSION=${CI_COMMIT_TAG}
    environment:
      # golib lives on Gitea; skip the public proxy/sum db.
      GOPRIVATE: git.example.com
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: https://s3.example.com
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-encapi
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 3Gi
            cpu: 2

  - name: package
    image: artifactapi.example.com/docker-internal/rpmbuilder:0.1.0-alma9
    commands:
      - ./scripts/build-rpm.sh ${CI_COMMIT_TAG}
    depends_on: [build]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: upload
    image: registry.example.com/example/almalinux9-base:20260606
    commands:
      - |
        HOST="https://artifactapi.example.com"
        REPO="rpm-internal"
        for rpm in dist/*.rpm; do
          FILE=$$(basename "$$rpm")
          code=$$(curl -s -o /dev/null -w '%{http_code}' "$$HOST/api/v2/remotes/$$REPO/files/Packages/$$FILE" || true)
          if [ "$$code" = "200" ]; then
            echo "$$FILE already exists in $$REPO (HTTP $$code); skipping upload"
            continue
          fi
          echo "Uploading $$FILE to $$REPO (existence probe returned $$code)"
          curl -f -X PUT \
            "$$HOST/api/v2/remotes/$$REPO/files/$$FILE" \
            -H "Content-Type: application/x-rpm" \
            --data-binary @"$$rpm"
        done
    depends_on: [package]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
