when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-encapi
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.example.com
      repo: registry.example.com/example/encapi
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      username: droneci
      password:
        from_secret: DRONECI_PASSWORD
      tags:
        - ${CI_COMMIT_TAG}
        - latest
