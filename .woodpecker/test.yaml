when:
  - event: pull_request

steps:
  - name: lint
    image: artifactapi.example.com/docker-internal/gobuilder:0.1.2-alma9
    commands:
      - make lint
    environment:
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: https://s3.example.com
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-encapi
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 3Gi
            cpu: 2

  - name: test
    image: artifactapi.example.com/docker-internal/gobuilder:0.1.2-alma9
    commands:
      # Container-backed DB tests self-skip when Docker is unavailable in CI;
      # they run in the docker-e2e path / locally.
      - make test-short
    environment:
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: https://s3.example.com
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-encapi
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 4Gi
            cpu: 2
