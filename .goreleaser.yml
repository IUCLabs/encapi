version: 2
project_name: encapi

builds:
  - &build
    id: encapi-cli
    main: ./cmd/encapi-cli
    binary: encapi-cli
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [linux]
    goarch: [amd64]
  - <<: *build
    id: encapi
    main: ./cmd/encapi
    binary: encapi

archives:
  - formats: [none]

nfpms:
  - package_name: encapi-cli
    ids: [encapi-cli]
    bindir: /usr/local/bin
    formats: [rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    release: "1"
    section: default
    priority: extra
    description: CLI + Puppet ENC entrypoint for encapi (External Node Classifier)
    maintainer: Ben Vincent <12552114+neoloc@users.noreply.github.com>
    homepage: https://github.com/IUCLabs/encapi
    license: MIT
    replaces: [encapi-cli]
    provides: [encapi-cli]
    contents:
      - src: packaging/encapi-enc
        dst: /usr/local/bin/encapi-enc
        file_info:
          mode: 0755
      - src: packaging/enc.conf
        dst: /etc/encapi/enc.conf
        type: config|noreplace
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/scripts/preinstall.sh

kos:
  - build: encapi
    base_image: gcr.io/distroless/static-debian12:nonroot
    repositories: [ghcr.io/iuclabs/encapi]
    tags: ["{{ .Tag }}", latest]
    bare: true
    platforms: [linux/amd64]
    sbom: none
    labels:
      org.opencontainers.image.source: https://github.com/IUCLabs/encapi

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: scripts/sign.sh
    args: ["${artifact}", "${signature}"]

changelog:
  disable: true
